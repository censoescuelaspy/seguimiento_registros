name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:data
      - run: npm run test:static
      - run: npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio público
        shell: bash
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js version.json .nojekyll _site/
          cp -R assets docs _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
